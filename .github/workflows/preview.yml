name: Preview pull request website

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
      - name: Ensure pdfinfo is installed
        run: command -v pdfinfo || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Install dependencies
        run: npm ci
      - name: Build PDFs
        run: npm run pdfs
      - name: Build site
        run: npm run build
      - name: Summarize thesis PDFs
        run: |
          echo '### One-page thesis PDFs' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the `thesis-pdfs` artifact below to review the three PDF announcements. The HTML site is built for validation but is not uploaded.' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          for pdf in public/pdfs/theses/*.pdf; do
            echo "- \`$(basename "$pdf")\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload thesis PDF announcements
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdfs
          path: public/pdfs/theses/*.pdf
          if-no-files-found: error
          retention-days: 14
