name: Preview pull request website

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
      - name: Ensure pdfinfo is installed
        run: command -v pdfinfo || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Install dependencies
        run: npm ci
      - name: Build PDFs
        run: npm run pdfs
      - name: Build site
        run: npm run build
      - name: Upload reviewable site build
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: dist/
          retention-days: 14
